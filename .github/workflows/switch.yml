name: Switch build

on:
  push:
    branches:
      - master
      - breeze-home-toggle
    tags:
      - '*'
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:
    inputs:
      daemon_only:
        description: Build only the release daemon/install package
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-switch:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'ci skip')
    runs-on: ubuntu-latest
    container: devkitpro/devkita64

    strategy:
      fail-fast: false
      matrix:
        mode: ${{ fromJSON(inputs.daemon_only && '["release"]' || '["debug","release"]') }}
        variant: ${{ fromJSON(inputs.daemon_only && '["sysmodule"]' || '["homebrew","sysmodule"]') }}

    steps:
      - name: Get current date as cache key
        id: cache_key
        run: echo "key=$(date +'%W')" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        shell: bash
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get -y install curl gcc g++ zip unzip zstd
          else
            apt-get update
            apt-get -y install curl gcc g++ zip unzip zstd
          fi

      - name: Test Breeze launch handoff policy
        if: matrix.variant == 'sysmodule' && matrix.mode == 'release'
        shell: bash
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror tests/breeze_launch_handoff_test.cpp -o /tmp/breeze-launch-handoff-test
          /tmp/breeze-launch-handoff-test

      # Atmosphere-libs 1.12.0 (lib/Atmosphere-libs) needs libnx newer than the
      # container's 4.12.0 release (pgl shell events and more). Build the same
      # switchbrew commit the local builds use.
      - name: Build libnx (switchbrew 20cbcfd9)
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/switchbrew/libnx.git /tmp/libnx
          git -C /tmp/libnx checkout --detach 20cbcfd90567f7bf84df7725f27e345e2164fa6b
          make -C /tmp/libnx/nx -j"$(nproc)" install
          grep -q pglEventObserverGetShellEvent "$DEVKITPRO/libnx/include/switch/services/pgl.h"

      - name: Set xmake env
        run: echo "XMAKE_GLOBALDIR=${{ runner.workspace }}/xmake-global" >> "$GITHUB_ENV"

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@dev
          actions-cache-folder: .xmake-cache-W${{ steps.cache_key.outputs.key }}

      - name: Update xmake repository
        shell: bash
        run: |
          xmake repo --update --root
          xmake repo -u --root

      - name: Configure xmake
        shell: bash
        run: |
          if [ "${{ matrix.variant }}" = "homebrew" ]; then
            xmake f --yes -p cross -m "${{ matrix.mode }}" -a aarch64 --toolchain=devkita64 --homebrew=y -vD --root
          else
            xmake f --yes -p cross -m "${{ matrix.mode }}" -a aarch64 --toolchain=devkita64 -vD --root
          fi

      - name: Build SwitchU
        shell: bash
        run: |
          set -o pipefail
          if ! xmake -vD --root 2>&1 | tee build.log; then
            # Job logs need a GitHub sign-in; annotations do not. Put the
            # compiler's errors and the end of the log into one annotation.
            { (dkp-pacman -Q libnx devkitA64 2>/dev/null || pacman -Q libnx devkitA64 2>/dev/null || true)
              grep -nE "error:|Error [0-9]+|undefined reference|No such file" build.log | head -40
              echo "----- last lines -----"
              tail -n 25 build.log; } > failure.txt
            msg=$(tr -d '\r' < failure.txt | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=xmake build failed::${msg}"
            exit 1
          fi

      - name: Package install layout
        run: xmake install -o "dist/${{ matrix.variant }}/${{ matrix.mode }}" --root

      # The same two files a local release ships: SwitchU.zip (the whole
      # install layout) and home_daemon.zip (the daemon folder only, which
      # Breeze installs). Files only, no folder entries, atmosphere first.
      - name: Create release zips
        if: matrix.variant == 'sysmodule'
        shell: bash
        run: |
          out="$PWD/artifacts"
          mkdir -p "$out"
          cd "dist/sysmodule/${{ matrix.mode }}"
          test -f atmosphere/contents/0100000000001000/exefs.nsp
          test -f switch/SwitchU/bin/menu/main
          zip -q -r -D -X "$out/SwitchU.zip" atmosphere switch
          zip -q -r -D -X "$out/home_daemon.zip" atmosphere/contents/0100000000001000
          unzip -l "$out/SwitchU.zip" | tail -n 1
          unzip -l "$out/home_daemon.zip"

      - name: Upload homebrew artifact
        if: matrix.variant == 'homebrew'
        uses: actions/upload-artifact@v4
        with:
          name: SwitchU-homebrew-${{ matrix.mode }}
          if-no-files-found: error
          path: dist/homebrew/${{ matrix.mode }}/

      - name: Upload release zips
        if: matrix.variant == 'sysmodule'
        uses: actions/upload-artifact@v4
        with:
          name: SwitchU-${{ matrix.mode }}
          if-no-files-found: error
          path: |
            artifacts/SwitchU.zip
            artifacts/home_daemon.zip

  # A pushed tag gets a DRAFT release with the two zips attached, to be
  # checked and published by hand.
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-switch
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release zips
        uses: actions/download-artifact@v4
        with:
          name: SwitchU-release
          path: release

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: ${{ github.ref_name }}
          files: |
            release/SwitchU.zip
            release/home_daemon.zip
