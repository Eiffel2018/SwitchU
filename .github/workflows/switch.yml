name: Switch build

on:
  push:
    branches:
      - master
      - breeze-home-toggle
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-switch:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'ci skip')
    runs-on: ubuntu-latest
    container: devkitpro/devkita64

    strategy:
      fail-fast: false
      matrix:
        mode:
          - debug
          - release
        variant:
          - homebrew
          - sysmodule

    steps:
      - name: Get current date as cache key
        id: cache_key
        run: echo "key=$(date +'%W')" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system dependencies
        shell: bash
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get -y install curl gcc g++ zip zstd
          else
            apt-get update
            apt-get -y install curl gcc g++ zip zstd
          fi

      # Atmosphere-libs 1.12.0 (lib/Atmosphere-libs) needs libnx newer than the
      # container's 4.12.0 release (pgl shell events and more). Build the same
      # switchbrew commit the local builds use.
      - name: Build libnx (switchbrew 20cbcfd9)
        shell: bash
        run: |
          git clone --filter=blob:none https://github.com/switchbrew/libnx.git /tmp/libnx
          git -C /tmp/libnx checkout --detach 20cbcfd90567f7bf84df7725f27e345e2164fa6b
          make -C /tmp/libnx/nx -j"$(nproc)" install
          grep -q pglEventObserverGetShellEvent "$DEVKITPRO/libnx/include/switch/services/pgl.h"

      - name: Set xmake env
        run: echo "XMAKE_GLOBALDIR=${{ runner.workspace }}/xmake-global" >> "$GITHUB_ENV"

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@dev
          actions-cache-folder: .xmake-cache-W${{ steps.cache_key.outputs.key }}

      - name: Update xmake repository
        shell: bash
        run: |
          xmake repo --update --root
          xmake repo -u --root

      - name: Configure xmake
        shell: bash
        run: |
          if [ "${{ matrix.variant }}" = "homebrew" ]; then
            xmake f --yes -p cross -m "${{ matrix.mode }}" -a aarch64 --toolchain=devkita64 --homebrew=y -vD --root
          else
            xmake f --yes -p cross -m "${{ matrix.mode }}" -a aarch64 --toolchain=devkita64 -vD --root
          fi

      - name: Build SwitchU
        shell: bash
        run: |
          set -o pipefail
          if ! xmake -vD --root 2>&1 | tee build.log; then
            # Job logs need a GitHub sign-in; annotations do not. Put the
            # compiler's errors and the end of the log into one annotation.
            { (dkp-pacman -Q libnx devkitA64 2>/dev/null || pacman -Q libnx devkitA64 2>/dev/null || true)
              grep -nE "error:|Error [0-9]+|undefined reference|No such file" build.log | head -40
              echo "----- last lines -----"
              tail -n 25 build.log; } > failure.txt
            msg=$(tr -d '\r' < failure.txt | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=xmake build failed::${msg}"
            exit 1
          fi

      - name: Package install layout
        run: xmake install -o "dist/${{ matrix.variant }}/${{ matrix.mode }}" --root

      - name: Create sysmodule zip
        if: matrix.variant == 'sysmodule'
        shell: bash
        run: |
          repo_root="$PWD"
          package_root="dist/sysmodule/${{ matrix.mode }}"
          archive_path="$repo_root/artifacts/SwitchU-sysmodule-${{ matrix.mode }}.zip"

          test -d "$package_root/atmosphere"
          test -d "$package_root/switch"

          mkdir -p "$repo_root/artifacts"
          cd "$package_root"
          zip -r "$archive_path" atmosphere switch

      - name: Upload homebrew artifact
        if: matrix.variant == 'homebrew'
        uses: actions/upload-artifact@v4
        with:
          name: SwitchU-homebrew-${{ matrix.mode }}
          if-no-files-found: error
          path: |
            build/cross/aarch64/${{ matrix.mode }}/SwitchU.nro
            build/cross/aarch64/${{ matrix.mode }}/SwitchU-Manager.nro
            dist/homebrew/${{ matrix.mode }}/

      - name: Upload sysmodule artifact
        if: matrix.variant == 'sysmodule'
        uses: actions/upload-artifact@v4
        with:
          name: SwitchU-sysmodule-${{ matrix.mode }}
          if-no-files-found: error
          path: artifacts/SwitchU-sysmodule-${{ matrix.mode }}.zip
